<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The ball from the home screen: ball yellow, a soft shade lower right, two white seams. -->
  <defs><clipPath id="ball"><circle cx="256" cy="256" r="240"/></clipPath></defs>
  <circle cx="256" cy="256" r="240" fill="#c2cf33"/>
  <g clip-path="url(#ball)">
    <circle cx="220" cy="220" r="240" fill="#dceb3a"/>
    <g transform="rotate(-30 256 256)" fill="none" stroke="#fff" stroke-width="30">
      <circle cx="-64" cy="256" r="250"/>
      <circle cx="576" cy="256" r="250"/>
    </g>
  </g>
</svg>
